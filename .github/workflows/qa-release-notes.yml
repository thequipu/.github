# Reusable: posts a merged PR's "How to test" cases to Slack #qa-release-notes.
# Each repo calls it from its own .github/workflows/qa-release-notes.yml (see workflow-templates/).
name: QA release notes

on:
  workflow_call:
    inputs:
      channel:
        description: Slack channel id to post to
        type: string
        default: C0CKZV49DHT # #qa-release-notes
      tracker_list_id:
        description: Slack list the test cases are added to as rows (empty = post to the channel only)
        type: string
        default: F0CL5GU0PEW # QA Test Tracker
      tracker_list_url:
        description: Link to that list, shown in the channel message
        type: string
        default: https://quipuco.slack.com/lists/T05NK13D473/F0CL5GU0PEW
    secrets:
      SLACK_QA_BOT_TOKEN:
        # Not required, so callers stay green until an org admin adds it; without it the job only warns
        required: false

jobs:
  post:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch the posting script
        uses: actions/checkout@v4
        with:
          repository: thequipu/.github
          ref: main
          path: .qa-release-notes
          sparse-checkout: scripts/qa-release-notes

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post to Slack
        run: node .qa-release-notes/scripts/qa-release-notes/post.js
        env:
          SLACK_QA_BOT_TOKEN: ${{ secrets.SLACK_QA_BOT_TOKEN }}
          SLACK_QA_CHANNEL: ${{ inputs.channel }}
          SLACK_QA_LIST_ID: ${{ inputs.tracker_list_id }}
          SLACK_QA_LIST_URL: ${{ inputs.tracker_list_url }}
          GITHUB_TOKEN: ${{ github.token }}
